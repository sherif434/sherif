<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متحكم الصوت - نسخة ثابتة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { transition: 0.3s; scroll-behavior: smooth; }
        .mic-on { background-color: #ef4444 !important; transform: scale(1.1); shadow: 0 0 20px rgba(239,68,68,0.5); }
    </style>
</head>
<body class="bg-gray-100 min-h-[200vh] flex flex-col items-center">

    <div class="fixed top-10 z-50 bg-white p-6 rounded-2xl shadow-2xl border-2 border-blue-500 w-80 text-center">
        <h2 class="text-xl font-bold mb-4">المساعد الصوتي</h2>
        
        <button id="btn" class="w-24 h-24 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-4 transition-all hover:bg-blue-700 shadow-lg">
            <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>

        <p id="status" class="text-gray-600 font-medium">اضغط لتشغيل الميكروفون</p>
        <div id="result" class="mt-4 p-2 bg-blue-50 text-blue-800 rounded min-h-[40px] text-sm">...</div>
    </div>

    <div class="mt-80 space-y-10 w-full max-w-xl px-4">
        <div class="h-64 bg-white rounded-xl shadow p-6 flex items-center justify-center text-2xl">قسم 1 (قل "انزل")</div>
        <div class="h-64 bg-white rounded-xl shadow p-6 flex items-center justify-center text-2xl">قسم 2</div>
        <div class="h-64 bg-white rounded-xl shadow p-6 flex items-center justify-center text-2xl">قسم 3</div>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        // التأكد من دعم المتصفح
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.innerText = "متصفحك لا يدعم التعرف على الصوت";
            btn.style.display = "none";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true; // يظل يعمل
            recognition.interimResults = false;

            let active = false;

            btn.onclick = () => {
                if (!active) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Recognition already started");
                    }
                } else {
                    recognition.stop();
                }
            };

            recognition.onstart = () => {
                active = true;
                btn.classList.add('mic-on');
                statusText.innerText = "أنا أسمعك الآن...";
                statusText.classList.add('text-red-600');
            };

            recognition.onend = () => {
                active = false;
                btn.classList.remove('mic-on');
                statusText.innerText = "توقف الاستماع. اضغط للبدء";
                statusText.classList.remove('text-red-600');
            };

            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                resultDiv.innerText = "قلت: " + text;
                handleVoice(text);
            };

            recognition.onerror = (event) => {
                console.error("Error:", event.error);
                if(event.error === 'not-allowed') {
                    alert("يجب السماح للمتصفح باستخدام الميكروفون من الإعدادات بجانب رابط الموقع");
                }
            };

            function handleVoice(cmd) {
                // التمرير
                if (cmd.includes('انزل') || cmd.includes('تحت')) {
                    window.scrollBy(0, window.innerHeight / 2);
                }
                if (cmd.includes('اطلع') || cmd.includes('فوق')) {
                    window.scrollBy(0, -(window.innerHeight / 2));
                }
                // الألوان
                if (cmd.includes('اسود') || cmd.includes('أسود')) {
                    document.body.style.backgroundColor = '#111';
                    document.body.style.color = 'white';
                }
                if (cmd.includes('ابيض') || cmd.includes('أبيض')) {
                    document.body.style.backgroundColor = '#f3f4f6';
                    document.body.style.color = 'black';
                }
                // فتح مواقع
                if (cmd.includes('جوجل')) {
                    window.open('https://www.google.com', '_blank');
                }
            }
        }
    </script>
</body>
</html>
